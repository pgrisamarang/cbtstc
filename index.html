<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Teacher Competition (STC) CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .custom-radio input:checked + div { background-color: #10b981; border-color: #10b981; color: white; }
        .custom-radio input:checked + div .letter-box { background-color: white; color: #10b981; }
        .animate-pulse-once { animation: pulse 0.5s ease-out 1; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col w-full h-full"></div>

    <script>
        // --- KONFIGURASI FIREBASE CLOUD ---
        const firebaseConfig = {
          apiKey: "AIzaSyC_2pCRdFGfWivtP27ynr-cjf8S0ius6pI",
          authDomain: "stc-pgri-cbt.firebaseapp.com",
          projectId: "stc-pgri-cbt",
          storageBucket: "stc-pgri-cbt.firebasestorage.app",
          messagingSenderId: "1003836044382",
          appId: "1:1003836044382:web:b6598f722e1954972ef0cf",
          measurementId: "G-L7BFL0RY2L"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- DATA SOAL STC (Berdasarkan Kisi-Kisi) ---
        const bankSoal = [
            // AD/ART (40%)
            { id: 1, cat: "AD/ART", text: "Organisasi PGRI merupakan kelanjutan dari Persatuan Guru Hindia Belanda (PGHB) yang didirikan pada tahun...", options: ["1908", "1912", "1928", "1945"], answer: 1 },
            { id: 2, cat: "AD/ART", text: "Sifat organisasi PGRI yang bermakna tidak memandang perbedaan tempat kerja, agama, dan asal-usul adalah...", options: ["Independen", "Nonpartisan", "Unitaristik", "Profesional"], answer: 2 },
            { id: 3, cat: "AD/ART", text: "Kepengurusan PGRI tingkat nasional berkedudukan di...", options: ["Ibu kota provinsi", "Ibu kota negara", "Setiap kabupaten/kota", "Kantor kementerian"], answer: 1 },
            { id: 4, cat: "AD/ART", text: "Makna warna putih pada dasar lambang (Panji) PGRI melambangkan...", options: ["Keberanian", "Kesucian/Ketulusan", "Pengabdian", "Kesejahteraan"], answer: 1 },
            { id: 5, cat: "AD/ART", text: "Forum tertinggi dalam menentukan kedaulatan organisasi PGRI adalah...", options: ["Konferensi Kerja Nasional", "Rapat Pimpinan Nasional", "Kongres", "Rapat Pleno"], answer: 2 },
            { id: 6, cat: "AD/ART", text: "Visi PGRI adalah mewujudkan organisasi yang...", options: ["Populer dan menguntungkan", "Terpercaya, dinamis, kuat, dan bermartabat", "Bersifat politis", "Setara dengan partai"], answer: 1 },
            { id: 7, cat: "AD/ART", text: "Masa bakti kepengurusan badan pimpinan organisasi PGRI ditetapkan selama...", options: ["3 tahun", "4 tahun", "5 tahun", "6 tahun"], answer: 2 },
            { id: 8, cat: "AD/ART", text: "Badan Khusus PGRI yang berfokus pada pengembangan pembelajaran cerdas dan karakter adalah...", options: ["BPLP", "LKBH", "PSLCC", "APKS"], answer: 2 },
            
            // HARDWARE (20%)
            { id: 9, cat: "Hardware", text: "Perangkat yang berfungsi memancarkan sinyal Wi-Fi di area kelas agar Papan Interaktif Digital (PID) dapat terhubung ke internet adalah...", options: ["Switch", "Router/Access Point", "Hub", "LAN Card"], answer: 1 },
            { id: 10, cat: "Hardware", text: "Keunggulan utama Solid State Drive (SSD) dibandingkan Harddisk (HDD) adalah...", options: ["Harga per GB lebih murah", "Kecepatan baca/tulis data jauh lebih cepat", "Menggunakan piringan magnetik", "Lebih mudah rusak"], answer: 1 },
            { id: 11, cat: "Hardware", text: "Port yang paling umum digunakan untuk menghubungkan Papan Interaktif Digital (PID) ke laptop adalah...", options: ["VGA atau HDMI", "PS/2", "RJ-11", "Audio Jack 3.5mm"], answer: 0 },
            { id: 12, cat: "Hardware", text: "Cara paling tepat untuk mematikan perangkat Papan Interaktif Digital (PID) agar awet adalah...", options: ["Mencabut langsung kabel power", "Menekan tombol power dari sistem (Shut down)", "Membiarkan menyala 24 jam", "Mereset paksa setiap hari"], answer: 1 },

            // SOFTWARE (20%)
            { id: 13, cat: "Software", text: "Sistem operasi yang dikembangkan oleh Google dan sering digunakan pada Chromebook adalah...", options: ["Windows 11", "macOS", "ChromeOS", "Linux Ubuntu"], answer: 2 },
            { id: 14, cat: "Software", text: "Aplikasi pembelajaran interaktif berbasis kuis yang memungkinkan siswa menjawab menggunakan gawai mereka secara real-time adalah...", options: ["Microsoft Word", "Kahoot! / Quizizz", "Adobe Photoshop", "VLC Media Player"], answer: 1 },
            { id: 15, cat: "Software", text: "Tipe ekstensi file yang menunjukkan dokumen tersebut adalah bahan ajar berformat Portable Document Format adalah...", options: [".docx", ".xlsx", ".pdf", ".pptx"], answer: 2 },
            { id: 16, cat: "Software", text: "Fitur 'Share' atau 'Bagikan' pada Google Drive dengan akses 'Viewer' berarti...", options: ["Penerima dapat mengedit file", "Penerima dapat menghapus file", "Penerima hanya dapat melihat/membaca file", "Penerima menjadi pemilik file"], answer: 2 },

            // DIGITALISASI (20%)
            { id: 17, cat: "Digitalisasi", text: "Ekosistem utama yang dikembangkan Kemendikbudristek sebagai wadah bagi guru untuk belajar, berkarya, dan mengajar adalah...", options: ["Platform Merdeka Mengajar (PMM)", "Ruang Guru", "Zenius", "PeduliLindungi"], answer: 0 },
            { id: 18, cat: "Digitalisasi", text: "Konsep pembelajaran yang melibatkan pemanfaatan sumber digital untuk membuat siswa aktif berkolaborasi dan berpikir kritis disebut...", options: ["Pembelajaran konvensional", "Pembelajaran Berpusat pada Murid berbasis digital", "Pembelajaran satu arah", "Pembelajaran pasif"], answer: 1 },
            { id: 19, cat: "Digitalisasi", text: "Kemampuan guru untuk menemukan, mengevaluasi, menggunakan, dan membuat informasi menggunakan teknologi digital disebut...", options: ["Literasi Digital", "Literasi Finansial", "Literasi Sains", "Numerasi"], answer: 0 },
            { id: 20, cat: "Digitalisasi", text: "Ikon gembok pada address bar peramban web menandakan bahwa situs pendidikan yang sedang diakses...", options: ["Sedang di-hack", "Memiliki koneksi aman (HTTPS) terenkripsi", "Komputer terkena virus", "Tidak membutuhkan kuota internet"], answer: 1 }
        ];

        // --- STATE APLIKASI ---
        let state = {
            view: 'home', // home, ujian, result, panitia_login, panitia_dash
            pesertaNama: '',
            pesertaAsal: '',
            pesertaNPA: '',
            shuffledQuestions: [],
            answers: {}, // format: { indexSoal: indexJawaban }
            currentQ: 0,
            timer: 90 * 60, // 90 Menit dalam detik
            startTime: null,
            violations: 0,
            intervalId: null,
            liveScores: []
        };

        // --- SISTEM PENYIMPANAN SESI (KEBAL RELOAD) ---
        function saveLocalState() {
            localStorage.setItem('stc_cbt_state', JSON.stringify(state));
        }
        function clearLocalState() {
            localStorage.removeItem('stc_cbt_state');
        }

        // --- SISTEM POP-UP KUSTOM (PENGGANTI ALERT & CONFIRM) ---
        function customAlert(title, msg, type='info', callback=null) {
            const div = document.createElement('div');
            div.className = 'fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm';
            const icon = type === 'error' ? '<i class="fa-solid fa-triangle-exclamation text-red-500"></i>' :
                         type === 'warning' ? '<i class="fa-solid fa-circle-exclamation text-amber-500"></i>' :
                         '<i class="fa-solid fa-circle-info text-blue-500"></i>';
            div.innerHTML = `
                <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center animate-pulse-once">
                    <div class="text-5xl mb-3">${icon}</div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${title}</h3>
                    <p class="text-slate-600 text-sm mb-6">${msg}</p>
                    <button id="btn-c-ok" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 rounded-xl transition shadow">Mengerti</button>
                </div>`;
            document.body.appendChild(div);
            document.getElementById('btn-c-ok').onclick = () => { div.remove(); if(callback) callback(); };
        }

        function customConfirm(title, msg, onYes) {
            const div = document.createElement('div');
            div.className = 'fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm';
            div.innerHTML = `
                <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
                    <div class="text-5xl mb-3"><i class="fa-solid fa-circle-question text-amber-500"></i></div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${title}</h3>
                    <p class="text-slate-600 text-sm mb-6">${msg}</p>
                    <div class="flex gap-3">
                        <button id="btn-c-no" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 rounded-xl transition">Batal</button>
                        <button id="btn-c-yes" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 rounded-xl transition shadow">Ya, Yakin</button>
                    </div>
                </div>`;
            document.body.appendChild(div);
            document.getElementById('btn-c-no').onclick = () => div.remove();
            document.getElementById('btn-c-yes').onclick = () => { div.remove(); onYes(); };
        }

        function promptResetLomba() {
            const div = document.createElement('div');
            div.className = 'fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm';
            div.innerHTML = `
                <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
                    <div class="text-5xl mb-3"><i class="fa-solid fa-skull-crossbones text-red-500"></i></div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Reset Perlombaan</h3>
                    <p class="text-slate-600 text-sm mb-4">Semua data peserta di server akan dihapus permanen. Ketik <strong>RESET</strong> untuk melanjutkan.</p>
                    <input type="text" id="inp-reset" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-3 text-center font-bold text-red-600 text-lg mb-6 uppercase focus:outline-none focus:border-red-500" placeholder="Ketik RESET">
                    <div class="flex gap-3">
                        <button id="btn-r-no" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 rounded-xl transition">Batal</button>
                        <button id="btn-r-yes" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition shadow">Hapus Data</button>
                    </div>
                </div>`;
            document.body.appendChild(div);
            document.getElementById('btn-r-no').onclick = () => div.remove();
            document.getElementById('btn-r-yes').onclick = () => {
                const val = document.getElementById('inp-reset').value.trim().toUpperCase();
                div.remove();
                if(val === 'RESET') {
                    executeResetDatabase();
                } else {
                    customAlert('Gagal', 'Kata kunci salah. Reset dibatalkan.', 'error');
                }
            };
        }

        function executeResetDatabase() {
            showLoading("Mereset Data Server...");
            db.collection("peserta_stc").get().then((snapshot) => {
                const batch = db.batch();
                snapshot.docs.forEach((doc) => {
                    batch.delete(doc.ref);
                });
                return batch.commit();
            }).then(() => {
                hideLoading();
                customAlert("Berhasil", "Seluruh data perlombaan telah direset menjadi nol.", "info");
                fetchParticipants();
            }).catch((e) => {
                hideLoading();
                customAlert("Error", "Gagal mereset data: " + e.message, "error");
            });
        }

        // --- FIREBASE: SIMPAN DAN AMBIL DATA ---
        function saveParticipantResult(res) {
            return db.collection("peserta_stc").doc(res.npa).set(res)
                .then(() => {
                    console.log("Data berhasil dikirim ke Cloud Firebase!");
                })
                .catch((error) => {
                    console.error("Error menyimpan data: ", error);
                    customAlert("Koneksi Error", "Koneksi terputus! Data disimpan secara luring sementara.", "error");
                });
        }

        async function fetchParticipants() {
            try {
                const snapshot = await db.collection("peserta_stc").get();
                let list = [];
                snapshot.forEach(doc => {
                    list.push(doc.data());
                });
                
                // Tie-breaker: Jika nilai sama, urutkan berdasarkan durasi tercepat
                list.sort((a, b) => {
                    if (b.nilaiAkhir !== a.nilaiAkhir) return b.nilaiAkhir - a.nilaiAkhir;
                    return a.durasi - b.durasi;
                });
                state.liveScores = list;
            } catch (error) {
                console.error("Gagal mengambil Live Score:", error);
            }
        }

        // --- ANTI CHEAT SYSTEM (Kini Tersimpan Secara Real-time) ---
        function handleVisibilityChange() {
            if (document.hidden && state.view === 'ujian') {
                state.violations += 1;
                saveLocalState();
                customAlert("Peringatan Pelanggaran!", `Anda telah keluar dari layar ujian! Ini adalah pelanggaran ke-${state.violations}. Poin Anda akan dikurangi 1% di akhir.`, "warning");
            }
        }
        function initAntiCheat() {
            document.removeEventListener("visibilitychange", handleVisibilityChange);
            document.addEventListener("visibilitychange", handleVisibilityChange);
        }

        // --- TIMER ---
        function startTimer() {
            clearInterval(state.intervalId);
            state.intervalId = setInterval(() => {
                state.timer--;
                saveLocalState(); // Simpan detik ini agar tidak hilang saat reload
                
                const m = Math.floor(state.timer / 60).toString().padStart(2, '0');
                const s = (state.timer % 60).toString().padStart(2, '0');
                const tEl = document.getElementById('timer-display');
                if(tEl) {
                    tEl.innerText = `${m}:${s}`;
                    if(state.timer <= 300) tEl.classList.add('text-red-500', 'animate-pulse'); // 5 menit terakhir
                }
                
                if (state.timer <= 0) {
                    clearInterval(state.intervalId);
                    customAlert("Waktu Habis", "Waktu Anda telah habis. Jawaban akan dikirim otomatis.", "warning", () => {
                        finishExam();
                    });
                }
            }, 1000);
        }

        // --- UTILITAS UI ---
        function switchView(v) {
            state.view = v;
            if(v === 'home') clearLocalState(); // Bersihkan memori lokal jika kembali ke beranda
            saveLocalState();
            render();
        }

        function showLoading(msg = 'Menyimpan data ujian Anda ke server...') {
            const div = document.createElement('div');
            div.id = 'loading-overlay';
            div.className = 'fixed inset-0 bg-slate-900/90 z-[200] flex flex-col items-center justify-center p-4 backdrop-blur-sm';
            div.innerHTML = `
                <div class="text-5xl text-emerald-500 mb-6 animate-spin"><i class="fa-solid fa-circle-notch"></i></div>
                <h3 class="text-xl font-bold text-white mb-2">${msg}</h3>
                <p class="text-slate-400 text-sm text-center">Mohon jangan tutup halaman ini.</p>`;
            document.body.appendChild(div);
        }

        function hideLoading() {
            const el = document.getElementById('loading-overlay');
            if(el) el.remove();
        }

        // --- FUNGSI UJIAN ---
        function startExam() {
            const nama = document.getElementById('inp_nama').value.trim();
            const asal = document.getElementById('inp_asal').value.trim();
            const npa = document.getElementById('inp_npa').value.trim();

            if(!nama || !asal || !npa) {
                customAlert('Data Belum Lengkap', 'Mohon lengkapi seluruh form data diri Anda terlebih dahulu!', 'warning');
                return;
            }

            state.pesertaNama = nama;
            state.pesertaAsal = asal;
            state.pesertaNPA = npa;
            state.startTime = Date.now();
            
            // Acak Soal
            let shuffled = [...bankSoal].sort(() => 0.5 - Math.random());
            state.shuffledQuestions = shuffled;
            
            switchView('ujian');
            startTimer();
            initAntiCheat();
        }

        function setAnswer(qIndex, aIndex) {
            state.answers[qIndex] = aIndex;
            saveLocalState();
            render();
        }

        function confirmFinish() {
            const answeredCount = Object.keys(state.answers).length;
            const unans = state.shuffledQuestions.length - answeredCount;
            if(unans > 0) {
                customConfirm("Konfirmasi Akhiri Ujian", `Masih ada <b class="text-red-500">${unans} soal</b> yang belum dijawab. Apakah yakin ingin mengakhiri ujian?`, () => {
                    finishExam();
                });
            } else {
                customConfirm("Kirim Jawaban", "Apakah Anda yakin ingin mengirimkan jawaban ujian ini?", () => {
                    finishExam();
                });
            }
        }

        function finishExam() {
            clearInterval(state.intervalId);
            document.removeEventListener("visibilitychange", handleVisibilityChange);
            
            showLoading("Memproses Nilai & Menyimpan ke Cloud...");

            const durationSecs = Math.floor((Date.now() - state.startTime) / 1000);
            const durationMins = Math.floor(durationSecs / 60);

            // Hitung Skor
            let correct = 0;
            state.shuffledQuestions.forEach((q, idx) => {
                if(state.answers[idx] === q.answer) correct++;
            });

            // Bobot maksimal 100 untuk 50 soal (ini sampel ada 20 soal, kita anggap total bobot 100)
            let baseScore = (correct / state.shuffledQuestions.length) * 100;
            let finalScore = baseScore - (state.violations * 1); // Penalti 1% per violation
            if (finalScore < 0) finalScore = 0;

            const resultData = {
                nama: state.pesertaNama,
                asal: state.pesertaAsal,
                npa: state.pesertaNPA,
                benar: correct,
                totalSoal: state.shuffledQuestions.length,
                pelanggaran: state.violations,
                durasi: durationSecs,
                nilaiAkhir: parseFloat(finalScore.toFixed(2)),
                waktuSelesai: new Date().toISOString()
            };

            saveParticipantResult(resultData).then(() => {
                hideLoading();
                switchView('result');
            });
        }

        // --- PANITIA ---
        async function handlePanitiaLogin() {
            const u = document.getElementById('p_user').value;
            const p = document.getElementById('p_pass').value;
            
            if(u === 'admin_stc' && p === 'pgri2026') {
                document.getElementById('btn-login-panitia').innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengambil Data...';
                await fetchParticipants();
                switchView('panitia_dash');
            } else {
                customAlert('Akses Ditolak', 'Username atau Password Panitia salah.', 'error');
            }
        }

        // --- RENDER UI ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.view === 'home') {
                app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4 relative overflow-hidden">
                    <!-- Background Design -->
                    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
                    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
                    
                    <div class="glass-panel max-w-4xl w-full rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row relative z-10">
                        <div class="md:w-1/2 p-10 flex flex-col justify-center bg-gradient-to-br from-slate-900 to-slate-800 text-white text-center md:text-left">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Logo_PGRI.svg/1200px-Logo_PGRI.svg.png" class="w-24 h-24 mx-auto md:mx-0 mb-6 drop-shadow-lg" alt="PGRI Logo">
                            <h1 class="text-4xl font-extrabold mb-2 leading-tight">Smart Teacher<br><span class="text-emerald-400">Competition</span></h1>
                            <p class="text-slate-300 text-sm mb-6 uppercase tracking-widest font-semibold">Ujian Berbasis Komputer</p>
                            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 mb-6 text-sm text-slate-300">
                                <ul class="text-left space-y-2">
                                    <li><i class="fa-solid fa-clock w-5 text-emerald-400"></i> Durasi Ujian: 90 Menit</li>
                                    <li><i class="fa-solid fa-list-check w-5 text-blue-400"></i> Proporsi: AD/ART, Hardware, Software, Digitalisasi</li>
                                    <li><i class="fa-solid fa-shield w-5 text-rose-400"></i> Anti-Cheat Aktif (Pindah tab = -1%)</li>
                                </ul>
                            </div>
                        </div>
                        
                        <div class="md:w-1/2 p-10 bg-white flex flex-col justify-center">
                            <h2 class="text-2xl font-bold text-slate-800 mb-6">Login Peserta</h2>
                            <div class="space-y-4 mb-8">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nama Lengkap</label>
                                    <input type="text" id="inp_nama" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition" placeholder="Masukkan nama Anda">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Asal Sekolah</label>
                                    <input type="text" id="inp_asal" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition" placeholder="Contoh: SDN 1 Tanjungkarya">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nomor Pokok Anggota (NPA)</label>
                                    <input type="number" id="inp_npa" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition" placeholder="Masukkan 10 digit NPA">
                                </div>
                            </div>
                            <button onclick="startExam()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/30 flex justify-center items-center gap-2 text-lg">
                                <i class="fa-solid fa-play"></i> Mulai Ujian Sekarang
                            </button>
                            
                            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                                <button onclick="switchView('panitia_login')" class="text-slate-400 hover:text-slate-600 text-sm font-semibold transition"><i class="fa-solid fa-user-shield mr-1"></i> Login Panitia</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            } 
            else if (state.view === 'panitia_login') {
                app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="bg-slate-800 max-w-md w-full rounded-2xl p-8 shadow-2xl border border-slate-700 relative">
                        <button onclick="switchView('home')" class="absolute top-4 right-4 text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
                        <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-3"><i class="fa-solid fa-shield-halved text-amber-500"></i> Login Panitia STC</h2>
                        <div class="space-y-4 mb-6">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Username Panitia</label>
                                <input type="text" id="p_user" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Password</label>
                                <input type="password" id="p_pass" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500">
                            </div>
                        </div>
                        <button id="btn-login-panitia" onclick="handlePanitiaLogin()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3.5 rounded-xl transition">Masuk Dashboard</button>
                    </div>
                </div>`;
            }
            else if (state.view === 'panitia_dash') {
                app.innerHTML = `
                <div class="flex-1 flex flex-col bg-slate-100">
                    <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
                        <div class="flex items-center gap-3">
                            <div class="bg-amber-500 text-slate-950 px-3 py-1 rounded-lg font-bold text-sm">PANITIA STC</div>
                            <h1 class="font-bold text-lg hidden sm:block">Live Score & Monitoring</h1>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="promptResetLomba()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm transition font-semibold"><i class="fa-solid fa-trash-can mr-2"></i> Reset Lomba</button>
                            <button onclick="switchView('home')" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm transition"><i class="fa-solid fa-right-from-bracket mr-2"></i> Keluar</button>
                        </div>
                    </header>
                    <main class="flex-1 max-w-6xl w-full mx-auto p-6 overflow-y-auto">
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                <h2 class="text-xl font-bold text-slate-800">Klasemen Sementara</h2>
                                <button onclick="fetchParticipants().then(()=>render())" class="text-slate-500 hover:text-emerald-600 bg-white border border-slate-200 px-3 py-1 rounded-lg text-sm"><i class="fa-solid fa-rotate-right mr-1"></i> Segarkan</button>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-100 text-slate-500 text-sm uppercase">
                                            <th class="p-4 font-bold">Rank</th>
                                            <th class="p-4 font-bold">Peserta</th>
                                            <th class="p-4 font-bold text-center">NPA</th>
                                            <th class="p-4 font-bold text-center">Benar</th>
                                            <th class="p-4 font-bold text-center">Pelanggaran</th>
                                            <th class="p-4 font-bold text-center">Durasi</th>
                                            <th class="p-4 font-bold text-right text-emerald-600">Nilai Akhir</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${state.liveScores.map((p, i) => `
                                        <tr class="border-b border-slate-50 hover:bg-slate-50 transition">
                                            <td class="p-4 font-bold ${i===0?'text-amber-500 text-lg':i===1?'text-slate-400':i===2?'text-amber-700':''}">${i+1}</td>
                                            <td class="p-4">
                                                <div class="font-bold text-slate-800">${p.nama}</div>
                                                <div class="text-xs text-slate-500">${p.asal}</div>
                                            </td>
                                            <td class="p-4 text-center text-sm font-mono">${p.npa}</td>
                                            <td class="p-4 text-center font-semibold text-blue-600">${p.benar}/${p.totalSoal}</td>
                                            <td class="p-4 text-center font-semibold ${p.pelanggaran > 0 ? 'text-red-500' : 'text-slate-400'}">${p.pelanggaran}x (-${p.pelanggaran}%)</td>
                                            <td class="p-4 text-center text-sm">${Math.floor(p.durasi/60)}m ${p.durasi%60}s</td>
                                            <td class="p-4 text-right font-extrabold text-lg text-emerald-600">${p.nilaiAkhir}</td>
                                        </tr>`).join('')}
                                        ${state.liveScores.length === 0 ? `<tr><td colspan="7" class="p-8 text-center text-slate-400">Belum ada peserta yang menyelesaikan ujian.</td></tr>` : ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>`;
            }
            else if (state.view === 'ujian') {
                const q = state.shuffledQuestions[state.currentQ];
                app.innerHTML = `
                <header class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center shadow-md sticky top-0 z-50">
                    <div class="flex items-center gap-3">
                        <div class="bg-emerald-500 text-slate-950 px-2 py-1 rounded text-xs font-bold">STC 2026 CBT</div>
                        <div class="font-semibold text-sm hidden sm:block">${state.pesertaNama} (${state.pesertaAsal})</div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="bg-slate-800 px-3 py-1.5 rounded-lg flex items-center gap-2 border border-slate-700">
                            <i class="fa-regular fa-clock text-amber-400"></i>
                            <span id="timer-display" class="font-mono font-bold text-lg">--:--</span>
                        </div>
                        <button onclick="confirmFinish()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg font-bold text-sm transition">Selesai</button>
                    </div>
                </header>
                
                <main class="flex-1 flex flex-col md:flex-row max-w-7xl w-full mx-auto p-4 md:p-6 gap-6 bg-slate-50 min-h-0">
                    <!-- Lembar Soal -->
                    <div class="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                            <div class="bg-slate-100 text-slate-600 font-bold px-4 py-1.5 rounded-full text-sm">SOAL NOMOR ${state.currentQ + 1} DARI ${state.shuffledQuestions.length}</div>
                            <div class="text-sm font-semibold text-slate-400"><i class="fa-solid fa-tag mr-1"></i> Kategori: ${q.cat}</div>
                        </div>
                        <div class="p-6 md:p-10 flex-1 overflow-y-auto text-lg text-slate-800">
                            <p class="mb-8 leading-relaxed">${q.text}</p>
                            <div class="space-y-3">
                                ${q.options.map((opt, i) => `
                                    <label class="custom-radio block cursor-pointer group">
                                        <input type="radio" name="q_opt" class="hidden" onchange="setAnswer(${state.currentQ}, ${i})" ${state.answers[state.currentQ] === i ? 'checked' : ''}>
                                        <div class="flex items-center p-4 rounded-xl border-2 border-slate-200 group-hover:border-emerald-200 transition duration-200 bg-white">
                                            <div class="letter-box w-8 h-8 rounded bg-slate-100 text-slate-500 flex items-center justify-center font-bold mr-4 text-sm transition">${String.fromCharCode(65+i)}</div>
                                            <div class="flex-1 select-none font-medium">${opt}</div>
                                        </div>
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                        <div class="p-6 border-t border-slate-100 bg-slate-50 flex justify-between">
                            <button onclick="state.currentQ--; render()" class="px-6 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-200 transition ${state.currentQ === 0 ? 'invisible' : ''}"><i class="fa-solid fa-arrow-left mr-2"></i> Sebelumnya</button>
                            ${state.currentQ < state.shuffledQuestions.length - 1 ? 
                                `<button onclick="state.currentQ++; render()" class="px-6 py-3 rounded-xl font-bold text-white bg-slate-800 hover:bg-slate-700 transition shadow">Selanjutnya <i class="fa-solid fa-arrow-right ml-2"></i></button>` : 
                                `<button onclick="confirmFinish()" class="px-6 py-3 rounded-xl font-bold text-white bg-emerald-500 hover:bg-emerald-600 transition shadow">Selesai & Kirim <i class="fa-solid fa-check ml-2"></i></button>`
                            }
                        </div>
                    </div>
                    
                    <!-- Navigasi Nomor -->
                    <div class="w-full md:w-72 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 h-fit shrink-0">
                        <h3 class="font-bold text-slate-800 mb-4">Navigasi Soal</h3>
                        <div class="grid grid-cols-5 gap-2">
                            ${state.shuffledQuestions.map((_, i) => {
                                const isAns = state.answers[i] !== undefined;
                                const isCur = state.currentQ === i;
                                let classes = "w-10 h-10 rounded-lg font-bold text-sm flex items-center justify-center transition border ";
                                if(isCur) classes += "ring-2 ring-offset-2 ring-emerald-500 ";
                                if(isAns) classes += "bg-emerald-500 text-white border-emerald-600";
                                else classes += "bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200";
                                
                                return `<button onclick="state.currentQ=${i}; render()" class="${classes}">${i+1}</button>`;
                            }).join('')}
                        </div>
                        <div class="mt-6 pt-6 border-t border-slate-100 text-xs font-semibold space-y-2">
                            <div class="flex items-center text-slate-500"><div class="w-3 h-3 rounded bg-emerald-500 mr-2"></div> Sudah Dijawab</div>
                            <div class="flex items-center text-slate-400"><div class="w-3 h-3 rounded bg-slate-100 border border-slate-200 mr-2"></div> Belum Dijawab</div>
                        </div>
                    </div>
                </main>`;
            }
            else if (state.view === 'result') {
                let correct = 0;
                state.shuffledQuestions.forEach((q, idx) => { if(state.answers[idx] === q.answer) correct++; });
                const durasi = Math.floor((Date.now() - state.startTime) / 1000);
                const mins = Math.floor(durasi / 60);
                let baseScore = (correct / state.shuffledQuestions.length) * 100;
                let finalScore = baseScore - (state.violations * 1);
                if (finalScore < 0) finalScore = 0;

                app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4 bg-slate-900 text-white">
                    <div class="max-w-md w-full text-center">
                        <div class="w-24 h-24 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-4xl mx-auto mb-6">
                            <i class="fa-solid fa-award"></i>
                        </div>
                        <h2 class="bg-emerald-500 text-emerald-950 px-4 py-1 rounded-full font-bold text-xs inline-block mb-4">UJIAN SELESAI BERHASIL</h2>
                        <h1 class="text-3xl font-extrabold mb-1">${state.pesertaNama}</h1>
                        <p class="text-slate-400 text-sm mb-8">${state.pesertaAsal} • NPA: ${state.pesertaNPA}</p>
                        
                        <div class="bg-slate-800 rounded-2xl p-6 mb-8 text-left border border-slate-700">
                            <div class="flex justify-between items-center mb-4 border-b border-slate-700/50 pb-4">
                                <span class="text-slate-400">Jawaban Benar:</span>
                                <span class="font-bold text-emerald-400">${correct} / ${state.shuffledQuestions.length}</span>
                            </div>
                            <div class="flex justify-between items-center mb-4 border-b border-slate-700/50 pb-4">
                                <span class="text-slate-400">Total Pelanggaran:</span>
                                <span class="font-bold ${state.violations > 0 ? 'text-red-400' : 'text-slate-400'}">${state.violations} Kali (-${state.violations}%)</span>
                            </div>
                            <div class="flex justify-between items-center mb-6">
                                <span class="text-slate-400">Durasi Pengerjaan:</span>
                                <span class="font-bold text-white">${mins} Menit</span>
                            </div>
                            <div class="flex justify-between items-end pt-4 border-t border-slate-700">
                                <span class="text-slate-400 font-bold">Nilai Akhir:</span>
                                <span class="font-black text-5xl text-amber-400 drop-shadow-md">${parseFloat(finalScore.toFixed(2))}</span>
                            </div>
                        </div>
                        
                        <button onclick="switchView('home')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-4 rounded-xl transition">Kembali ke Beranda Utama</button>
                    </div>
                </div>`;
            }
        }

        // Inisialisasi Pertama Kali
        window.onload = function() {
            // Coba pulihkan sesi (kebal reload)
            const savedState = localStorage.getItem('stc_cbt_state');
            if(savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    Object.assign(state, parsed);
                } catch(e) {
                    console.error("Gagal memulihkan sesi", e);
                }
            }

            render();

            // Lanjutkan fungsi krusial berdasarkan halaman saat direload
            if(state.view === 'ujian') {
                startTimer();
                initAntiCheat();
            } else if (state.view === 'panitia_dash') {
                fetchParticipants().then(() => render());
            }
        };
    </script>
</body>
</html>
