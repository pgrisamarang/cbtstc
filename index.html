        }

        function clearLocalState() {
            localStorage.removeItem('stc_cbt_state');
        }

            }
        });

        // Load data peserta (Sekarang terhubung dengan Live Database Firebase)
        function getRegisteredParticipants() {
            // Mengurutkan berdasarkan nilai tertinggi, jika sama urutkan dari durasi tercepat
            let sorted = [...liveParticipants];
            sorted.sort((a, b) => {
                if (b.nilai !== a.nilai) {
                    return b.nilai - a.nilai; 
                }
                // Tie breaker: waktu tercepat (parsing dari "XX Menit")
                let waktuA = parseInt(a.waktu) || 90;
                let waktuB = parseInt(b.waktu) || 90;
                return waktuA - waktuB;
            });
            return sorted;
        }

        // --- MULAI UJIAN & ACAK SOAL ---
        function startExam() {
            const nama = document.getElementById('inp_nama').value.trim();
            const asal = document.getElementById('inp_asal').value.trim();
            const npa = document.getElementById('inp_npa').value.trim();

            if(!nama || !asal || !npa) {
                alert('Mohon lengkapi semua data diri Anda terlebih dahulu!');
                return;
            }

            state.pesertaNama = nama;
            state.pesertaAsal = asal;
            state.pesertaNPA = npa;
            state.currentQuestion = 0;
            state.answers = {};
            state.violations = 0;
            state.timeLeft = 90 * 60; // 90 menit

            // Acak soal (Fisher-Yates Shuffle) agar tiap peserta mendapat urutan berbeda
            let cloned = [...BANK_SOAL];
            for (let i = cloned.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
            }
            state.shuffledQuestions = cloned;
            state.examStarted = true;
            state.view = 'ujian';

            saveLocalState(); // Simpan state awal ke penyimpanan lokal
            render();
            startTimer();
            initAntiCheat();
        }

        // --- TIMER UJIAN ---
        function startTimer() {
            if(state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if(state.timeLeft > 0) {
                    state.timeLeft--;
                    updateTimerDisplay();
                    // Simpan status waktu setiap 5 detik agar jika direfresh, timer tidak mengulang dari 90 menit
                    if(state.timeLeft % 5 === 0) saveLocalState(); 
                } else {
                    clearInterval(state.timerInterval);
                    finishExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timer-box');
            if(el) {
                const m = Math.floor(state.timeLeft / 60);
                const s = state.timeLeft % 60;
                el.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }
        }

        // --- ANTI-CHEAT PWA (DETEKSI MINIMIZE / BLUR) ---
        function initAntiCheat() {
            document.addEventListener('visibilitychange', handleVisibilityChange);
            window.addEventListener('blur', handleBlurWindow);
        }

        function removeAntiCheat() {
            document.removeEventListener('visibilitychange', handleVisibilityChange);
            window.removeEventListener('blur', handleBlurWindow);
        }

        function handleVisibilityChange() {
            if (document.hidden && state.view === 'ujian') {
                registerViolation();
            }
        }

        function handleBlurWindow() {
            if (state.view === 'ujian') {
                registerViolation();
            }
        }

        function registerViolation() {
            state.violations++;
            saveLocalState(); // Simpan penambahan pelanggaran ke memori
            showViolationModal();
        }

        function showViolationModal() {
            const modal = document.getElementById('violation-modal');
            if(modal) {
                document.getElementById('v-count').innerText = state.violations;
                modal.classList.remove('hidden');
            }
        }

        function closeViolationModal() {
            const modal = document.getElementById('violation-modal');
            if(modal) {
                modal.classList.add('hidden');
            }
        }

                            <button onclick="closeViolationModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl transition">
                                Saya Mengerti, Lanjutkan Ujian
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectAnswer(qIdx, optIdx) {
            state.answers[qIdx] = optIdx;
            saveLocalState(); // Auto-save setiap menjawab
            render();
        }

        function nextQuestion() {
            if(state.currentQuestion < state.shuffledQuestions.length - 1) {
                state.currentQuestion++;
                saveLocalState(); // Auto-save posisi soal
                render();
            }
        }

        function prevQuestion() {
            if(state.currentQuestion > 0) {
                state.currentQuestion--;
                saveLocalState();
                render();
            }
        }

        function goToQuestion(idx) {
            state.currentQuestion = idx;
            saveLocalState();
            render();
        }

        function confirmFinish() {
            const answeredCount = Object.keys(state.answers).length;
            const unans = state.shuffledQuestions.length - answeredCount;
            if(unans > 0) {
                if(!confirm(`Masih ada ${unans} soal yang belum dijawab. Apakah Anda yakin ingin mengakhiri ujian?`)) return;
            } else {
                if(!confirm('Apakah Anda yakin ingin mengirimkan jawaban ujian ini?')) return;
            }
            finishExam();
        }

        // --- SELESAI UJIAN & KALKULASI SKOR ---
        async function finishExam() {
            removeAntiCheat();
            if(state.timerInterval) clearInterval(state.timerInterval);

            let correctCount = 0;
            state.shuffledQuestions.forEach((q, idx) => {
                if(state.answers[idx] === q.ans) {
                    correctCount++;
                }
            });

            // Skor mentah 0-100
            let rawScore = Math.round((correctCount / state.shuffledQuestions.length) * 100);
            
            // Pengurangan penalti pelanggaran (1 pelanggaran = -1%)
            let finalScore = Math.max(0, rawScore - state.violations);

            const durationUsed = Math.floor((90 * 60 - state.timeLeft) / 60);

            state.scoreData = {
                nama: state.pesertaNama,
                asal: state.pesertaAsal,
                npa: state.pesertaNPA,
                nilai: finalScore,
                benar: correctCount,
                salah: state.shuffledQuestions.length - correctCount,
                pelanggaran: state.violations,
                waktu: `${durationUsed} Menit`,
                status: "Selesai"
            };

            // Menampilkan loading state sebentar secara aman
            showLoading("Menyimpan data ujian Anda ke server Cloud...");

            await saveParticipantResult(state.scoreData);
            
            hideLoading();
            state.view = 'hasil';
            saveLocalState(); // Simpan tampilan hasil akhir
            render();
        }

        // --- HALAMAN HASIL UJIAN PESERTA ---
        function renderHasil() {
            const d = state.scoreData;
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 to-indigo-950 text-white">
                    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center space-y-6">
                        <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto text-3xl">
                            <i class="fa-solid fa-award"></i>
                        </div>
                        <div>
                            <span class="bg-emerald-400 text-slate-950 font-bold text-xs px-3 py-1 rounded-full uppercase tracking-wider">Ujian Selesai Berhasil</span>
                            <h2 class="text-2xl font-bold mt-2">${d.nama}</h2>
                            <p class="text-slate-400 text-sm">${d.asal} • NPA: ${d.npa}</p>
                        </div>

                        <div class="bg-slate-800/80 rounded-2xl p-6 border border-slate-700 space-y-3">
                            <div class="flex justify-between text-sm">
                                <span class="text-slate-400">Jawaban Benar:</span>
                                <span class="font-bold text-emerald-400">${d.benar} / 50</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span class="text-slate-400">Total Pelanggaran:</span>
                                <span class="font-bold text-red-400">${d.pelanggaran} Kali (-${d.pelanggaran}%)</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span class="text-slate-400">Durasi Pengerjaan:</span>
                                <span class="font-bold text-slate-200">${d.waktu}</span>
                            </div>
                            <div class="pt-3 border-t border-slate-700 flex justify-between items-center">
                                <span class="font-semibold text-slate-300">Nilai Akhir:</span>
                                <span class="text-3xl font-extrabold text-amber-400">${d.nilai}</span>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <button onclick="switchView('home')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-3 rounded-xl transition">
                                Kembali ke Beranda Utama
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchView(v) {
            state.view = v;
            if (v === 'home') {
                clearLocalState(); // Bersihkan sesi otomatis jika kembali ke beranda
            }
            render();
        }

        // Inisialisasi Pertama
        window.onload = function() {
            // Cek apakah ada sesi ujian yang nyangkut (pemulihan otomatis)
            const savedState = localStorage.getItem('stc_cbt_state');
            if(savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    Object.assign(state, parsed); // Pulihkan seluruh status ujian
                } catch(e) {
                    console.error("Gagal memulihkan sesi ujian", e);
                }
            }

            render();

            // Jika saat dimuat ulang ternyata posisi masih sedang ujian, lanjutkan timer & anti-cheat
            if(state.view === 'ujian') {
                startTimer();
                initAntiCheat();
            }
        };
    </script>
</body>
</html>
